{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="content-section">
  <div class="media">
    <img class="rounded-circle account-img" src="{{ user.profile.image.url }}">
    <div class="media-body">
      <h2 class="account-heading">{{ user.username }}</h2>
      <p class="text-secondary">{{ user.email }}</p>
    </div>
  </div>
  <!-- Formulaire update du profil -->
  <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Profile Info</legend>
                {{ u_form|crispy }}
                {{ p_form|crispy }}
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-info" type="submit">Update</button>    
            </div>
        </form>
  </div>
  <!-- Statistiques -->
  <div class="content-section" style="margin-top: 20px;">
        <h3>Activity Statistics</h3>
        <hr>
        <div class="row">
            <div class="col-md-12 mb-5">
                <canvas id="agentChart" style="width:100%;max-width:700px"></canvas>
            </div>
            
            <div class="col-md-12">
                <canvas id="dayChart" style="width:100%;max-width:700px"></canvas>
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>

    <script>
        //RECUP DES DONNEES 
        
        // Données pour le Graph A
        const xValuesA = {{ agent_names|safe }};
        const yValuesA = {{ agent_counts|safe }};
        
        // Données pour le Graph B 
        const xValuesB = {{ dates_labels|safe }};
        const yValuesB = {{ dates_counts|safe }};

        //GRAPH A
        const ctxA = document.getElementById('agentChart');
        const barColors = ["red", "green", "blue", "orange", "brown"];
        //  boucle les couleurs
        const dynamicColors = [];
        for (let i = 0; i < xValuesA.length; i++) {
            dynamicColors.push(barColors[i % barColors.length]);
        }

        new Chart(ctxA, {
          type: "bar",
          data: {
            labels: xValuesA,
            datasets: [{
              backgroundColor: dynamicColors,
              data: yValuesA
            }]
          },
          options: {
            plugins: {
              legend: {display: false},
              title: {
                display: true,
                text: "Messages per Agent",
                font: {size: 16}
              }
            },
            scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1 } }
            }
          }
        });


        // GRAPH B  
        const ctxB = document.getElementById('dayChart');

        new Chart(ctxB, {
          type: "line",
          data: {
            labels: xValuesB, // dates 
            datasets: [{
              fill: false,
              lineTension: 0,
              backgroundColor: "blue", //couleurs points
              borderColor: "rgba(0,0,255,0.1)",//couleurs lignes
              data: yValuesB  
            }]
          },
          options: {
            plugins: {
              legend: {display: false},
              title: {
                display: true,
                text: "Activity per Day", 
                font: {size: 16}
              }
            },
            scales: { 
              y: { beginAtZero: true, ticks: { stepSize: 1 } }
            }
          }
        });
    </script>

{% endblock content %}
